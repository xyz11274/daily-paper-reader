name: Generate query candidates
run-name: dpr-query-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: '网页生成请求编号'
        required: true
        type: string
      prompt:
        description: '当前检索需求及候选格式，不包含密钥'
        required: true
        type: string

permissions:
  contents: read
  checks: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install model client dependency
        run: python -m pip install requests
      - name: Generate and return candidates
        env:
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          QUERY_REQUEST_ID: ${{ inputs.request_id }}
          QUERY_PROMPT: ${{ inputs.prompt }}
        run: python src/query_candidates.py
